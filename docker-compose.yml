services:
  postgres:
    image: postgres:18-alpine
    container_name: undercover-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: undercover_dev
    volumes:
      - undercover_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d undercover_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  undercover_pgdata:
    name: undercover_pgdata
